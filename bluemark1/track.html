<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweets — تتبّع الطلب</title>
<meta name="theme-color" content="#1e4ed0" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#eef2f7;color:#0f172a;
    min-height:100vh;padding:16px;line-height:1.7;}
  .wrap{max-width:460px;margin:0 auto;}
  .card{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(15,23,42,.08);
    padding:18px;margin-bottom:14px;}
  .brand{text-align:center;border-bottom:2px solid #1e4ed0;padding-bottom:10px;margin-bottom:12px;}
  .brand h1{font-size:21px;color:#1e3a8a;}
  .brand p{font-size:13px;color:#64748b;}
  .status{text-align:center;border-radius:12px;padding:12px;font-weight:800;font-size:16px;margin-bottom:14px;}
  .st-pending{background:#fef3c7;color:#92400e;}
  .st-approved{background:#dcfce7;color:#166534;}
  .st-expired{background:#fee2e2;color:#991b1b;}
  .row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px dashed #e2e8f0;}
  .row:last-child{border-bottom:0;}
  .row b{color:#334155;}
  .items{margin-top:10px;}
  .items .it{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13.5px;}
  .sec-title{font-size:14px;font-weight:800;color:#1e3a8a;margin:12px 0 4px;}
  .big-no{font-size:30px;font-weight:900;color:#1e3a8a;text-align:center;letter-spacing:1px;}
  .center{text-align:center;}
  .muted{color:#64748b;font-size:12.5px;}
  .loading,.error{text-align:center;padding:40px 16px;color:#64748b;}
  .spin{width:34px;height:34px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;
    margin:0 auto 12px;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
  .foot{text-align:center;color:#94a3b8;font-size:11.5px;margin-top:6px;}
</style>
<link rel="stylesheet" href="brand.css" />
<style>
  body{ font-family:var(--br-font) !important; background:var(--br-bg) !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingState" class="card loading">
    <div class="spin"></div>
    <div>… جارٍ جلب حالة الطلب</div>
  </div>
  <div id="errorState" class="card error hidden">
    <div style="font-size:40px;">⚠️</div>
    <div id="errMsg" style="margin-top:8px;">تعذر العثور على السجل</div>
  </div>
  <div id="recState" class="hidden">
    <div class="card">
      <div class="brand">
        <img src="logo.png" alt="Sweets" style="width:60px;height:60px;object-fit:contain;margin:0 auto 6px;display:block" />
        <h1 id="brandName">المتجر</h1>
        <p>تتبّع حالة الطلب</p>
      </div>
      <div id="statusBox" class="status"></div>
      <div id="orderNoBox" class="hidden">
        <div class="sec-title center">رقم الطلب / الفاتورة</div>
        <div class="big-no" id="orderNo">—</div>
      </div>
      <div id="detailsBox"></div>
      <div class="foot" id="privNote">لا تُعرض المبالغ المالية في صفحة التتبّع حفاظاً على الخصوصية</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script src="track.js"></script>
</body>
</html>
