<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0d1526" />
<title>مسح الباركود — الجوال</title>
<link rel="icon" type="image/png" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Cairo',sans-serif;background:linear-gradient(160deg,#16233c 0%,#0d1526 100%);
    color:#e9eefb;display:flex;align-items:center;justify-content:center;
    padding:calc(64px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    overflow:hidden;
  }
  .screen{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
  .hidden{display:none !important}
  /* شريط علوي (شعار النظام + رجوع) */
  .topbar{position:fixed;top:0;right:0;left:0;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:20}
  .tb-back{width:38px;height:38px;flex:0 0 auto;border-radius:12px;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.14);color:#e9eefb;display:flex;align-items:center;
    justify-content:center;text-decoration:none;font-size:18px;font-weight:800}
  .tb-logo img{width:30px;height:30px;border-radius:9px;background:#fff;padding:2px;display:block}
  .tb-name{font-weight:800;font-size:15px;color:#e9eefb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-spacer{flex:1}
  h1{font-size:20px;font-weight:800;text-align:center}
  .sub{font-size:13.5px;color:#9fb0cc;text-align:center;line-height:1.7}
  input{
    width:100%;padding:13px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:15px;outline:none;
  }
  input:focus{border-color:#3b82f6;background:rgba(59,130,246,.14)}
  button{
    width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;
    font-weight:800;font-size:15px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.35);
  }
  button:active{transform:scale(.98)}
  button.ghost{background:rgba(255,255,255,.10);color:#e9eefb;box-shadow:none;border:1px solid rgba(255,255,255,.14);font-weight:700;padding:11px}
  .err{color:#fca5a5;font-size:13.5px;font-weight:700;text-align:center;min-height:18px}
  .warn{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);color:#fcd34d;
    border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.7}
  /* شاشة الكاميرا */
  #cam{height:100%;max-width:460px;justify-content:flex-start}
  .view{position:relative;width:100%;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:0;pointer-events:none}
  .frame:before,.frame:after,.frame i:before,.frame i:after{
    content:'';position:absolute;width:52px;height:52px;border:4px solid #60a5fa;
  }
  .frame:before{top:16%;right:12%;border-left:0;border-bottom:0;border-radius:12px 0 0 0}
  .frame:after{top:16%;left:12%;border-right:0;border-bottom:0;border-radius:0 12px 0 0}
  .frame i:before{bottom:16%;right:12%;border-left:0;border-top:0;border-radius:0 0 0 12px}
  .frame i:after{bottom:16%;left:12%;border-right:0;border-top:0;border-radius:0 0 12px 0}
  .bar{display:flex;align-items:center;gap:10px}
  #status{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;
    padding:11px 13px;font-size:13.5px;font-weight:700;min-height:44px;display:flex;align-items:center}
  .torch{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
    font-size:19px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .last{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.35);color:#86efac;border-radius:12px;
    padding:11px 13px;font-size:13.5px;font-weight:700;min-height:44px;display:flex;align-items:center;word-break:break-all}
  .last:empty{display:none}
  .who{font-size:12.5px;font-weight:700;color:#93c5fd;text-align:center;background:rgba(59,130,246,.12);
    border:1px solid rgba(59,130,246,.28);border-radius:12px;padding:9px 12px}
  .who:empty{display:none}
  .hint{font-size:12px;color:#8fa3c0;text-align:center;line-height:1.8}
</style>
</head>
<body>

<!-- شريط علوي: شعار النظام + رجوع للكاشير -->
<div class="topbar">
  <a class="tb-back" href="index.html" title="رجوع">‹</a>
  <span class="tb-logo"><img src="logo.png" alt="" /></span>
  <span class="tb-name" id="sysName">نظام الكاشير</span>
  <span class="tb-spacer"></span>
</div>

<!-- شاشة الدخول -->
<div id="login" class="screen">
  <h1>📷 مسح الباركود</h1>
  <p class="sub">سجّل الدخول بحساب الكاشير، ثم امسح الباركود بكاميرا الجوال —<br/>سيظهر الصنف مباشرة في كمبيوتر المحل.</p>
  <div id="cloudWarn" class="warn hidden">⚠️ هذا الجهاز غير متصل بالسحابة — لن تصل نتيجة المسح إلى الكمبيوتر. تأكد من الاتصال بالإنترنت.</div>
  <input id="u" type="text" placeholder="اسم المستخدم" autocomplete="username" inputmode="text" />
  <input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
  <button id="loginBtn">دخول</button>
  <div id="loginErr" class="err"></div>
  <p class="hint">نفس بيانات الدخول المستخدمة في الكمبيوتر.</p>
</div>

<!-- شاشة الكاميرا -->
<div id="cam" class="screen hidden">
  <div class="view">
    <video id="vid" playsinline muted autoplay></video>
    <div class="frame"><i></i></div>
  </div>
  <div class="bar">
    <div id="status">وجّه الكاميرا نحو الباركود…</div>
    <button class="torch" id="torchBtn" title="الإضاءة">🔦</button>
  </div>
  <div class="who" id="scanWho"></div>
  <div class="last" id="last"></div>
  <button class="ghost" id="logout">خروج</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script src="jsqr.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var USER_KEY = 'scan_user';
  var stream = null, detector = null, timer = null, lastCode = '', lastAt = 0, torchOn = false;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function beep(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.25);
      o.start(); o.stop(ctx.currentTime+0.26);
    }catch(e){}
  }

  // ===== تسجيل الدخول =====
  function savedUser(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'null'); }catch(e){ return null; } }
  function doLogin(){
    var u = $('u').value.trim(), p = $('p').value;
    $('loginErr').textContent = '';
    if(!u || !p){ $('loginErr').textContent = 'اكتب اسم المستخدم وكلمة المرور'; return; }
    if(!DB.isCloud()){ $('cloudWarn').classList.remove('hidden'); }
    DB.getUsers().then(function(users){
      var found = (users||[]).filter(function(x){ return x.username===u && x.password===p; })[0];
      if(!found){ $('loginErr').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
      try{ localStorage.setItem(USER_KEY, JSON.stringify({username:found.username, name:found.name||found.username})); }catch(e){}
      try{ $('scanWho').textContent = 'يُرسَل إلى حساب: ' + (found.name || found.username); }catch(e2){}
      startCam();
    }).catch(function(e){
      $('loginErr').textContent = 'تعذّر الاتصال بالسحابة: ' + ((e && e.message) || e);
    });
  }
  $('loginBtn').onclick = doLogin;
  $('u').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  $('p').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  $('logout').onclick = function(){
    try{ localStorage.removeItem(USER_KEY); }catch(e){}
    stopCam();
    $('cam').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('last').textContent = '';
    $('status').textContent = 'وجّه الكاميرا نحو الباركود…';
  };

  // ===== الكاميرا والمسح =====
  function startCam(){
    $('login').classList.add('hidden');
    $('cam').classList.remove('hidden');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      $('status').textContent = 'الكاميرا غير مدعومة في هذا المتصفح';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
      .then(function(s){
        stream = s;
        $('vid').srcObject = s;
        $('vid').play().catch(function(){});
        setupDetector();
        loop();
      })
      .catch(function(){
        navigator.mediaDevices.getUserMedia({ video:true, audio:false }).then(function(s){
          stream = s; $('vid').srcObject = s; $('vid').play().catch(function(){});
          setupDetector(); loop();
        }).catch(function(){
          $('status').textContent = 'تعذّر فتح الكاميرا — امنح إذن الكاميرا من المتصفح';
        });
      });
  }
  function stopCam(){
    if(timer){ clearInterval(timer); timer = null; }
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if(detector){ detector = null; }
  }
  function setupDetector(){
    if(!('BarcodeDetector' in window)) return;
    if(!window.__bdFmt){
      window.__bdFmt = BarcodeDetector.getSupportedFormats().catch(function(){ return ['qr_code']; });
    }
    window.__bdFmt.then(function(fmts){
      try{ detector = new BarcodeDetector({ formats: fmts }); }catch(e){ detector = null; }
    });
  }
  function loop(){
    if(timer) clearInterval(timer);
    timer = setInterval(tick, 280);
  }
  function tick(){
    var vid = $('vid');
    if(!vid || vid.readyState < 2 || !vid.videoWidth) return;
    if(detector){
      detector.detect(vid).then(function(codes){
        if(codes && codes.length && codes[0].rawValue) onCode(codes[0].rawValue);
      }).catch(function(){});
      return;
    }
    // احتياطي: أكواد QR عبر jsQR
    if(typeof jsQR === 'undefined') return;
    var w = vid.videoWidth, h = vid.videoHeight;
    if(!w || !h) return;
    if(!window.__cv){ window.__cv = document.createElement('canvas'); }
    var cv = window.__cv;
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d', { willReadFrequently:true });
    ctx.drawImage(vid, 0, 0, w, h);
    var img;
    try{ img = ctx.getImageData(0, 0, w, h); }catch(e){ return; }
    var res = jsQR(img.data, w, h, { inversionAttempts:'dontInvert' });
    if(res && res.data) onCode(res.data);
  }

  // ===== إرسال النتيجة إلى الكمبيوتر =====
  function onCode(code){
    code = String(code||'').trim();
    if(!code) return;
    var now = Date.now();
    if(code === lastCode && (now - lastAt) < 2500) return;   // منع التكرار السريع
    lastCode = code; lastAt = now;
    $('status').textContent = 'جارٍ الإرسال إلى الكمبيوتر…';
    var user = savedUser() || {};
    DB.addScan(code, { device: (navigator.userAgent||'').slice(0,60), by: user.username || '' })
      .then(function(){
        $('status').textContent = '✅ تم الإرسال إلى الكمبيوتر';
        $('last').textContent = '✅ آخر مسح: ' + code;
        beep();
        if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
      })
      .catch(function(e){
        $('status').textContent = '⚠️ تعذّر الإرسال: ' + ((e && e.message) || e);
      });
  }

  // ===== زر الإضاءة =====
  $('torchBtn').onclick = function(){
    if(!stream) return;
    var track = stream.getVideoTracks()[0];
    if(!track) return;
    if(!torchOn && track.getCapabilities && track.getCapabilities().torch){
      track.applyConstraints({ advanced:[{ torch:true }] }).then(function(){
        torchOn = true; $('torchBtn').style.background = 'rgba(253,224,71,.25)';
      }).catch(function(){});
    } else if(torchOn){
      track.applyConstraints({ advanced:[{ torch:false }] }).then(function(){
        torchOn = false; $('torchBtn').style.background = '';
      }).catch(function(){});
    } else {
      $('status').textContent = 'الإضاءة غير مدعومة في هذا الجهاز';
    }
  };

  // ===== تحديد الحساب الذي تُرسَل إليه المسحات =====
  // 1) جلسة الكاشير في نفس التبويب (الجوال)
  // 2) الحساب الذي ضغط «Scan» من الكمبيوتر (نفس الجهاز)
  // 3) آخر حساب استُخدم في الماسح
  function resolveScanUser(){
    try{
      var sess = JSON.parse(sessionStorage.getItem('pos_user')||'null');
      if(sess && sess.username) return {username:sess.username, name:sess.name||sess.username};
    }catch(e){}
    try{
      var g = localStorage.getItem('pos_scan_user');
      if(g) return {username:g, name:g};
    }catch(e){}
    var su = savedUser();
    if(su) return su;
    return null;
  }
  // ===== دخول تلقائي من جلسة الكاشير (نفس التبويب) بدون كلمة مرور =====
  // عندما يفتح المستخدم زر «Scan» من صفحة الكاشير على الجوال، تكون الجلسة قائمة
  // في sessionStorage ⇒ ندخل مباشرة دون إعادة كتابة كلمة المرور.
  var auto = resolveScanUser();
  if(auto && auto.username){
    try{ localStorage.setItem(USER_KEY, JSON.stringify({username:auto.username, name:auto.name||auto.username})); }catch(e){}
  }

  // ===== بدء تلقائي لو كان مسجّل الدخول مسبقاً =====
  var su = savedUser();
  if(su){
    $('u').value = su.username || '';
    DB.getUsers().then(function(users){
      var ok = (users||[]).filter(function(x){ return x.username === (su.username||''); })[0];
      if(ok){
        startCam();
        try{ $('scanWho').textContent = 'يُرسَل إلى حساب: ' + (ok.name || ok.username); }catch(e){}
      }else{
        try{ localStorage.removeItem(USER_KEY); }catch(e2){}
        $('cam').classList.add('hidden');
        $('login').classList.remove('hidden');
      }
    }).catch(function(){ startCam(); });
  }
  if(!DB.isCloud()) $('cloudWarn').classList.remove('hidden');

  // ===== اسم النظام من الإعدادات (ليظهر الشعار الصحيح) =====
  try{
    DB.getSettings().then(function(cfg){
      var nm = (cfg && (cfg.headerBrand || cfg.name)) || '';
      if(nm){
        $('sysName').textContent = nm;
        document.title = nm + ' — مسح الباركود';
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
